<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="google-site-verification" content="H_3mZQ_dGA0BPkucGPuCed0ZDEH2zjo6NogkoZTd5_s">
  <meta name="description" content="북아현3구역 재개발 인포 홈페이지가 현재 임시로 운영을 중단했습니다.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="북아현3구역 재개발 인포">
  <meta property="og:title" content="홈페이지 임시 운영 중단 | 북아현3구역 재개발 인포">
  <meta property="og:description" content="홈페이지를 잠시 쉬어갑니다.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <title>홈페이지 임시 운영 중단 | 북아현3구역 재개발 인포</title>
  <style>
    :root{color-scheme:light;--ink:#183247;--muted:#64727a;--line:#d9dfe1;--accent:#c08d5a}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:#f6f5f1;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
    body:before{content:"";position:fixed;inset:0 0 auto;height:7px;background:#183247}
    .wrap{min-height:100svh;display:flex;flex-direction:column;justify-content:center;width:min(100% - 48px,680px);margin:auto;padding:76px 0 64px}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--accent);margin:0 0 36px}
    .rule{height:1px;background:var(--line);width:100%;margin-bottom:42px}
    .label{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:#6b797d}
    .dot{width:7px;height:7px;background:#b18c66;border-radius:50%}
    h1{font-size:clamp(36px,6.5vw,58px);font-weight:700;line-height:1.28;letter-spacing:-.055em;margin:24px 0 22px}
    .message{font-size:clamp(15px,2vw,17px);line-height:1.9;color:var(--muted);margin:0;max-width:520px}
    footer{font-size:12px;color:#899499;border-top:1px solid var(--line);padding-top:20px;margin-top:70px;letter-spacing:-.015em}
    @media(max-width:520px){.wrap{width:calc(100% - 44px);padding:80px 0 40px}.eyebrow{margin-bottom:28px}.rule{margin-bottom:36px}h1{margin:22px 0 18px}footer{margin-top:62px}}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">BUKAHYEON 3 · INFORMATION</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="label"><span class="dot" aria-hidden="true"></span>운영 안내</div>
    <h1>홈페이지를<br>잠시 쉬어갑니다.</h1>
    <p class="message">북아현3구역 재개발 인포는 현재 임시로 운영을 중단했습니다.<br>추후 다시 공개할 예정입니다.</p>
    <footer>북아현3구역 재개발 인포 · 개인 운영 홈페이지</footer>
  </main>
</body>
</html>
